name: 缺陷报告
description: 应用崩溃、功能异常，或表现和预期不一致
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量附上可复现步骤和日志，没有日志的问题很难定位。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页或安装包文件名里的版本号
      placeholder: 0.0.136
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 审批模式
      options:
        - 手动审批
        - 工作区写入
        - 完全访问
        - 自我进化
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 日志在 data/self-test/ 或 .tmp/ 下；截图直接拖进来。
      render: text
    validations:
      required: false
